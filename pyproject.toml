[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-futures-trading-bot"
version = "1.1.0"
description = "Binance Futures USDT-M Testnet trading bot with MARKET, LIMIT, and STOP_MARKET order support, CLI and web UI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.1,<9",
    "flask>=3.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.4",
]

[project.scripts]
trading-bot = "cli:app"

[tool.setuptools]
packages = ["bot", "ui"]
py-modules = ["cli", "run_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb short"

[tool.ruff]
line-length = 100
target-version = "py311"
